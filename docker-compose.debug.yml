services:
  backend:
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m scripts.seed &&
        exec python -Xfrozen_modules=off -m debugpy
        --listen 0.0.0.0:5678 --wait-for-client
        -m uvicorn app.main:app --host 0.0.0.0 --port 8000
